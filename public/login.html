<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DiaryMock Login</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #f3f4f6;
      }
      .card {
        width: 100%;
        max-width: 360px;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 18px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 22px;
      }
      .field {
        margin-bottom: 10px;
      }
      input {
        width: 100%;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        padding: 10px 12px;
      }
      button {
        width: 100%;
        border: none;
        border-radius: 8px;
        padding: 10px 12px;
        background: #111827;
        color: #ffffff;
        font-weight: 700;
        cursor: pointer;
      }
      #message {
        margin: 10px 0 0;
        font-size: 13px;
        color: #dc2626;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>로그인</h1>
      <div class="field">
        <input id="username" type="text" placeholder="아이디" autocomplete="off" />
      </div>
      <div class="field">
        <input id="password" type="password" placeholder="비밀번호" autocomplete="off" />
      </div>
      <button id="loginButton" type="button">로그인</button>
      <p id="message"></p>
    </main>

    <script>
      const username = document.getElementById("username");
      const password = document.getElementById("password");
      const loginButton = document.getElementById("loginButton");
      const message = document.getElementById("message");

      async function login() {
        message.textContent = "";
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            username: username.value.trim(),
            password: password.value.trim(),
          }),
        });

        const data = await response.json();
        if (!response.ok) {
          message.textContent = data.message || "로그인 실패";
          return;
        }
        window.location.href = "/";
      }

      loginButton.addEventListener("click", login);
      password.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          login();
        }
      });
    </script>
  </body>
</html>
